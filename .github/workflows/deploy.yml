name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Public :22 is firewalled; this box reaches the VPS over Tailscale.
# A self-hosted runner on emailvps pulls deploy.sh after CI is green.
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, linux, reasonreader]
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd /srv/reasonreader/prod
          ./scripts/deploy.sh
