services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reasonreader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-won}
    volumes:
      - reasonreader_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - reasonreader_minio:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"

  graph:
    build:
      context: .
      dockerfile: Dockerfile.graph
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reasonreader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-won}
      POSTGRES_URI: postgresql://${POSTGRES_USER:-reasonreader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-won}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:2024:2024"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.graph
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "ingest.http_server"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reasonreader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-won}
      S3_ENDPOINT: http://minio:9000
      INGEST_PORT: "8090"
      INGEST_TOKEN: ${SECRET_KEY}
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ASSISTANT_ID: ${NEXT_PUBLIC_ASSISTANT_ID:-agent}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reasonreader}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-won}
      LANGGRAPH_URL: http://graph:2024
      INGEST_URL: http://ingest:8090
      INGEST_TOKEN: ${SECRET_KEY}
      S3_ENDPOINT: http://minio:9000
    ports:
      - "127.0.0.1:3080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      graph:
        condition: service_started
      ingest:
        condition: service_started

volumes:
  reasonreader_postgres:
  reasonreader_minio:
