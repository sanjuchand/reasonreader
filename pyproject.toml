[project]
name = "wealth-of-nations-tutor"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain>=1.3.10",
    "langchain-openai>=1.1.14",
    "langchain-core>=1.3.3",
    "langgraph>=1.0.3",
    "langgraph-cli[inmem]>=0.4.31",
    "python-dotenv>=1.2.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=2.0.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
